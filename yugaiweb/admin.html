<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">

```
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>YugAI Admin</title>

<link
    rel="stylesheet"
    href="admin.css"
>
```

</head>

<body>

```
<main class="login-container">

    <section class="login-card">

        <div class="logo">
            <div class="logo-icon">Y</div>

            <h1>YugAI</h1>

            <p>Admin Dashboard</p>
        </div>


        <form id="loginForm">

            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <p
                id="errorMessage"
                class="error-message"
            ></p>


            <button
                type="submit"
                id="loginButton"
            >
                Login to Dashboard
            </button>

        </form>


        <a
            href="index.html"
            class="back-link"
        >
            ← Back to YugAI
        </a>

    </section>

</main>

<script src="admin.js"></script>
```

</body>
</html>
